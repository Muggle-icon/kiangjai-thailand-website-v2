<dialog id="app-gallery-dialog" class="kj-dialog screen-dialog app-gallery-dialog" aria-labelledby="app-gallery-title">
  <div class="kj-dialog-heading"><h2 id="app-gallery-title">ภาพตัวอย่างหน้าจอแอป</h2><button class="kj-close" type="button" data-close="gallery" aria-label="ปิดภาพหน้าจอ">{{icon:x}}</button></div>
  <div class="gallery-stage">
    <figure data-gallery-panel>{{app-screen:home}}</figure>
    <figure data-gallery-panel hidden>{{app-screen:repayment}}</figure>
    <figure data-gallery-panel hidden>{{app-screen:loan-plan}}</figure>
    <figure data-gallery-panel hidden>{{app-screen:withdrawal}}</figure>
  </div>
  <div class="gallery-controls"><button class="button button-outline gallery-arrow gallery-previous" type="button" data-gallery-previous aria-label="ภาพก่อนหน้า">{{icon:arrow-right}}</button><output data-gallery-position aria-live="polite" aria-atomic="true">1 / 4</output><button class="button button-outline gallery-arrow" type="button" data-gallery-next aria-label="ภาพถัดไป">{{icon:arrow-right}}</button></div>
</dialog>
